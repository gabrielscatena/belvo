[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "belvo"
version = "0.1.0"
description = "Data Science and decision-engine project"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mvp = ["pandas==2.3.0", "numpy==2.1.3"]
dev = ["pytest>=8.0", "ruff>=0.6", "ipykernel>=6.0"]
data = ["pandas>=2.0", "numpy>=1.24", "PyYAML>=6.0", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Upstream code is updated through git subtree; lint project-owned code here.
extend-exclude = ["tools/eda"]
